name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Loaded app/google-services.json from GitHub Secret."
            else
              echo "::error::Missing app/google-services.json. Add GitHub Actions secret GOOGLE_SERVICES_JSON."
              exit 1
            fi
          fi

      - name: Prepare .env for Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ ! -f .env ]; then
            RAW_URL="${VITE_SUPABASE_URL:-$SUPABASE_URL}"
            RAW_KEY="${VITE_SUPABASE_ANON_KEY:-$SUPABASE_ANON_KEY}"
            CLEAN_URL="$(printf '%s' "$RAW_URL" | tr -d ' \t\n\r"'\''')"
            CLEAN_KEY="$(printf '%s' "$RAW_KEY" | tr -d ' \t\n\r"'\''')"
            CLEAN_URL="${CLEAN_URL#VITE_SUPABASE_URL=}"
            CLEAN_URL="${CLEAN_URL#SUPABASE_URL=}"
            CLEAN_KEY="${CLEAN_KEY#VITE_SUPABASE_ANON_KEY=}"
            CLEAN_KEY="${CLEAN_KEY#SUPABASE_ANON_KEY=}"

            echo "Supabase URL present: $([ -n "$CLEAN_URL" ] && echo yes || echo no) (length=${#CLEAN_URL})"
            echo "Supabase Anon Key present: $([ -n "$CLEAN_KEY" ] && echo yes || echo no) (length=${#CLEAN_KEY})"

            if [ -z "$CLEAN_URL" ] || [ -z "$CLEAN_KEY" ]; then
              echo "::warning::VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY not set in GitHub Repository Secrets; Live Vercel server mode will work, Native mode needs those secrets."
            fi
            : > .env
            if [ -n "$CLEAN_URL" ]; then
              printf 'VITE_SUPABASE_URL=%s\n' "$CLEAN_URL" >> .env
            fi
            if [ -n "$CLEAN_KEY" ]; then
              printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$CLEAN_KEY" >> .env
            fi
            echo "Prepared .env for Secrets Gradle Plugin."
          fi

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > debug.keystore
              echo "Restored debug.keystore from GitHub Secret."
            elif [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Restored debug.keystore from debug.keystore.base64."
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManobsebaFoundation-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
